[build]
  publish = "public"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/products/boquete-panama-real-estate-lifestyle-discovery-1"
  to = "/trips/boquete-panama-real-estate-lifestyle-discovery"
  status = 301
